[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "three-tier-transcript-agent"
version = "0.1.0"
description = "LangGraph transcript summary and day-scoped RAG agent"
requires-python = ">=3.11"
dependencies = [
  "chromadb>=1.5,<2",
  "fastapi>=0.115,<1",
  "langchain-chroma>=1.0,<2",
  "langchain-core>=1.2,<2",
  "langchain-openai>=1.1,<2",
  "langchain-text-splitters>=1.1,<2",
  "langgraph>=1.1,<2",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
  "integration: requires external services such as OpenAI",
]
